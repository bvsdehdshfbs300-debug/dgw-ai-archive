<svg xmlns="http://www.w3.org/2000/svg" width="460" height="946" viewBox="0 0 460 946" role="img" aria-labelledby="title desc"><title id="title">从一次想法，到一次交付</title><desc id="desc">每一阶段，都留下可继续的东西。</desc><defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#c5d9d2" stroke-width=".6" opacity=".4"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#13796c" stroke-width="1.7"/></marker></defs><rect width="460" height="946" rx="20" fill="#f2f6f1"/><rect width="460" height="946" rx="20" fill="url(#grid)"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="28" y="38" fill="#13796c" font-size="13" font-weight="600" text-anchor="start">WORKFLOW</text><text x="28" y="80" fill="#173b42" font-size="27" font-weight="700" text-anchor="start">从一次想法，到一次交付</text><text x="28" y="112" fill="#4b6970" font-size="16" font-weight="400" text-anchor="start">每一阶段，都留下可继续的东西。</text><rect x="28" y="146" width="404" height="144" rx="13" fill="#fff" stroke="#b5ccc5"/><rect x="28" y="161" width="3" height="114" rx="1.5" fill="#13796c"/><text x="46" y="178" fill="#13796c" font-size="13" font-weight="600" text-anchor="start">01</text><text x="46" y="211" fill="#173b42" font-size="23" font-weight="700" text-anchor="start">明确问题</text><text x="46" y="240" fill="#4b6970" font-size="18" font-weight="400" text-anchor="start">现象与目标</text><text x="46" y="269" fill="#4b6970" font-size="18" font-weight="400" text-anchor="start">本轮要改什么</text><path d="M230 295V310" fill="none" stroke="#13796c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="316" width="404" height="144" rx="13" fill="#fff" stroke="#b5ccc5"/><rect x="28" y="331" width="3" height="114" rx="1.5" fill="#13796c"/><text x="46" y="348" fill="#13796c" font-size="13" font-weight="600" text-anchor="start">02</text><text x="46" y="381" fill="#173b42" font-size="23" font-weight="700" text-anchor="start">做出结果</text><text x="46" y="410" fill="#4b6970" font-size="18" font-weight="400" text-anchor="start">代码或页面</text><text x="46" y="439" fill="#4b6970" font-size="18" font-weight="400" text-anchor="start">能直接预览</text><path d="M230 465V480" fill="none" stroke="#13796c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="486" width="404" height="144" rx="13" fill="#fff" stroke="#b5ccc5"/><rect x="28" y="501" width="3" height="114" rx="1.5" fill="#13796c"/><text x="46" y="518" fill="#13796c" font-size="13" font-weight="600" text-anchor="start">03</text><text x="46" y="551" fill="#173b42" font-size="23" font-weight="700" text-anchor="start">验证审查</text><text x="46" y="580" fill="#4b6970" font-size="18" font-weight="400" text-anchor="start">操作与边界</text><text x="46" y="609" fill="#4b6970" font-size="18" font-weight="400" text-anchor="start">效果能复查</text><path d="M230 635V650" fill="none" stroke="#13796c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="656" width="404" height="144" rx="13" fill="#fff" stroke="#b5ccc5"/><rect x="28" y="671" width="3" height="114" rx="1.5" fill="#13796c"/><text x="46" y="688" fill="#13796c" font-size="13" font-weight="600" text-anchor="start">04</text><text x="46" y="721" fill="#173b42" font-size="23" font-weight="700" text-anchor="start">发布留痕</text><text x="46" y="750" fill="#4b6970" font-size="18" font-weight="400" text-anchor="start">版本与备份</text><text x="46" y="779" fill="#4b6970" font-size="18" font-weight="400" text-anchor="start">下一轮的起点</text><text x="28" y="884" fill="#13796c" font-size="17" font-weight="600" text-anchor="start">需求 → 预览 → 验证 → 版本记录</text><text x="28" y="924" fill="#4b6970" font-size="12" font-weight="400" text-anchor="start">地瓜丸 · 作品与方法 / 内容关系示意</text></g></svg>