<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450" role="img" aria-labelledby="title desc"><title id="title">值得做，也要维护得起</title><desc id="desc">个人工作室的三道选择题。</desc><defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#c5d9d2" stroke-width=".6" opacity=".4"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#13796c" stroke-width="1.7"/></marker></defs><rect width="1100" height="450" rx="20" fill="#f2f6f1"/><rect width="1100" height="450" rx="20" fill="url(#grid)"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="28" y="38" fill="#13796c" font-size="13" font-weight="600" text-anchor="start">DESIGN DECISIONS</text><text x="28" y="80" fill="#173b42" font-size="32" font-weight="700" text-anchor="start">值得做，也要维护得起</text><text x="28" y="112" fill="#4b6970" font-size="18" font-weight="400" text-anchor="start">个人工作室的三道选择题。</text><rect x="28.0" y="156" width="329.3333333333333" height="176" rx="13" fill="#fff" stroke="#b5ccc5"/><rect x="28.0" y="171" width="3" height="146" rx="1.5" fill="#13796c"/><text x="46.0" y="188" fill="#13796c" font-size="13" font-weight="600" text-anchor="start">01</text><text x="46.0" y="221" fill="#173b42" font-size="24" font-weight="700" text-anchor="start">学习有帮助吗</text><text x="46.0" y="250" fill="#4b6970" font-size="18" font-weight="400" text-anchor="start">能看懂哪一个现象</text><text x="46.0" y="279" fill="#4b6970" font-size="18" font-weight="400" text-anchor="start">能少走哪一步弯路</text><path d="M360.3333333333333 242H379.3333333333333" fill="none" stroke="#13796c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="385.3333333333333" y="156" width="329.3333333333333" height="176" rx="13" fill="#fff" stroke="#b5ccc5"/><rect x="385.3333333333333" y="171" width="3" height="146" rx="1.5" fill="#13796c"/><text x="403.3333333333333" y="188" fill="#13796c" font-size="13" font-weight="600" text-anchor="start">02</text><text x="403.3333333333333" y="221" fill="#173b42" font-size="24" font-weight="700" text-anchor="start">投入能持续吗</text><text x="403.3333333333333" y="250" fill="#4b6970" font-size="18" font-weight="400" text-anchor="start">实现与维护的成本</text><text x="403.3333333333333" y="279" fill="#4b6970" font-size="18" font-weight="400" text-anchor="start">优先解决实际阻力</text><path d="M717.6666666666666 242H736.6666666666666" fill="none" stroke="#13796c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="742.6666666666666" y="156" width="329.3333333333333" height="176" rx="13" fill="#fff" stroke="#b5ccc5"/><rect x="742.6666666666666" y="171" width="3" height="146" rx="1.5" fill="#13796c"/><text x="760.6666666666666" y="188" fill="#13796c" font-size="13" font-weight="600" text-anchor="start">03</text><text x="760.6666666666666" y="221" fill="#173b42" font-size="24" font-weight="700" text-anchor="start">结果能证明吗</text><text x="760.6666666666666" y="250" fill="#4b6970" font-size="18" font-weight="400" text-anchor="start">已有截图或测试</text><text x="760.6666666666666" y="279" fill="#4b6970" font-size="18" font-weight="400" text-anchor="start">计划与已完成分开</text><text x="28" y="388" fill="#13796c" font-size="19" font-weight="600" text-anchor="start">先让一个关键问题得到明确改善。</text><text x="28" y="428" fill="#4b6970" font-size="12" font-weight="400" text-anchor="start">地瓜丸 · 作品与方法 / 内容关系示意</text></g></svg>