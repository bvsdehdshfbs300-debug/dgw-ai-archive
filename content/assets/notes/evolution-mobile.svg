<svg xmlns="http://www.w3.org/2000/svg" width="460" height="840" viewBox="0 0 460 840" role="img" aria-labelledby="title desc"><title id="title">一项反馈，接着一轮改进</title><desc id="desc">按功能阶段阅读，而不是比较更新次数。</desc><defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#c5d9d2" stroke-width=".6" opacity=".4"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#13796c" stroke-width="1.7"/></marker></defs><rect width="460" height="840" rx="20" fill="#f2f6f1"/><rect width="460" height="840" rx="20" fill="url(#grid)"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="28" y="38" fill="#13796c" font-size="13" font-weight="600" text-anchor="start">PROJECT EVOLUTION</text><text x="28" y="80" fill="#173b42" font-size="27" font-weight="700" text-anchor="start">一项反馈，接着一轮改进</text><text x="28" y="112" fill="#4b6970" font-size="16" font-weight="400" text-anchor="start">按功能阶段阅读，而不是比较更新次数。</text><path d="M46 165V719" fill="none" stroke="#aac7bc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="46" cy="168" r="7" fill="#13796c" stroke="#13796c" stroke-width="2"/><text x="70" y="176" fill="#13796c" font-size="17" font-weight="600" text-anchor="start">2.0 / 2.1</text><text x="70" y="212" fill="#173b42" font-size="23" font-weight="700" text-anchor="start">把波形看清</text><text x="70" y="246" fill="#4b6970" font-size="18" font-weight="400" text-anchor="start">时间窗口、测量与局部细节</text><circle cx="46" cy="313" r="7" fill="#13796c" stroke="#13796c" stroke-width="2"/><text x="70" y="321" fill="#13796c" font-size="17" font-weight="600" text-anchor="start">2.2</text><text x="70" y="357" fill="#173b42" font-size="23" font-weight="700" text-anchor="start">让平台有温度</text><text x="70" y="391" fill="#4b6970" font-size="18" font-weight="400" text-anchor="start">平台脉搏、动态与充电</text><circle cx="46" cy="458" r="7" fill="#13796c" stroke="#13796c" stroke-width="2"/><text x="70" y="466" fill="#13796c" font-size="17" font-weight="600" text-anchor="start">3.0</text><text x="70" y="502" fill="#173b42" font-size="23" font-weight="700" text-anchor="start">理解高速数据流</text><text x="70" y="536" fill="#4b6970" font-size="18" font-weight="400" text-anchor="start">握手、缓冲、跨域与校验</text><circle cx="46" cy="603" r="7" fill="#13796c" stroke="#13796c" stroke-width="2"/><text x="70" y="611" fill="#13796c" font-size="17" font-weight="600" text-anchor="start">4.1</text><text x="70" y="647" fill="#173b42" font-size="23" font-weight="700" text-anchor="start">把外设放到桌面</text><text x="70" y="681" fill="#4b6970" font-size="18" font-weight="400" text-anchor="start">五项独立实验与逐针手册</text><text x="28" y="818" fill="#4b6970" font-size="12" font-weight="400" text-anchor="start">地瓜丸 · 作品与方法 / 内容关系示意</text></g></svg>