<svg xmlns="http://www.w3.org/2000/svg" width="460" height="776" viewBox="0 0 460 776" role="img" aria-labelledby="title desc"><title id="title">把“有问题”缩到具体环节</title><desc id="desc">先找到失败的位置，再选择改动。</desc><defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#c5d9d2" stroke-width=".6" opacity=".4"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#13796c" stroke-width="1.7"/></marker></defs><rect width="460" height="776" rx="20" fill="#f2f6f1"/><rect width="460" height="776" rx="20" fill="url(#grid)"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="28" y="38" fill="#13796c" font-size="13" font-weight="600" text-anchor="start">DIAGNOSIS</text><text x="28" y="80" fill="#173b42" font-size="27" font-weight="700" text-anchor="start">把“有问题”缩到具体环节</text><text x="28" y="112" fill="#4b6970" font-size="16" font-weight="400" text-anchor="start">先找到失败的位置，再选择改动。</text><rect x="28" y="146" width="404" height="144" rx="13" fill="#fff" stroke="#b5ccc5"/><rect x="28" y="161" width="3" height="114" rx="1.5" fill="#13796c"/><text x="46" y="178" fill="#13796c" font-size="13" font-weight="600" text-anchor="start">01</text><text x="46" y="211" fill="#173b42" font-size="23" font-weight="700" text-anchor="start">描述现象</text><text x="46" y="240" fill="#4b6970" font-size="18" font-weight="400" text-anchor="start">设备 / 操作 / 截图</text><text x="46" y="269" fill="#4b6970" font-size="18" font-weight="400" text-anchor="start">什么情况下会出现</text><path d="M230 295V310" fill="none" stroke="#13796c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="316" width="404" height="144" rx="13" fill="#fff" stroke="#b5ccc5"/><rect x="28" y="331" width="3" height="114" rx="1.5" fill="#13796c"/><text x="46" y="348" fill="#13796c" font-size="13" font-weight="600" text-anchor="start">02</text><text x="46" y="381" fill="#173b42" font-size="23" font-weight="700" text-anchor="start">缩小范围</text><text x="46" y="410" fill="#4b6970" font-size="18" font-weight="400" text-anchor="start">入口 / 页面 / 接口</text><text x="46" y="439" fill="#4b6970" font-size="18" font-weight="400" text-anchor="start">区分事实与猜测</text><path d="M230 465V480" fill="none" stroke="#13796c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="486" width="404" height="144" rx="13" fill="#fff" stroke="#b5ccc5"/><rect x="28" y="501" width="3" height="114" rx="1.5" fill="#13796c"/><text x="46" y="518" fill="#13796c" font-size="13" font-weight="600" text-anchor="start">03</text><text x="46" y="551" fill="#173b42" font-size="23" font-weight="700" text-anchor="start">修改与复查</text><text x="46" y="580" fill="#4b6970" font-size="18" font-weight="400" text-anchor="start">重现原来的步骤</text><text x="46" y="609" fill="#4b6970" font-size="18" font-weight="400" text-anchor="start">记录结果与影响范围</text><text x="28" y="714" fill="#13796c" font-size="17" font-weight="600" text-anchor="start">同一操作复查：问题是否真的消失？</text><text x="28" y="754" fill="#4b6970" font-size="12" font-weight="400" text-anchor="start">地瓜丸 · 作品与方法 / 内容关系示意</text></g></svg>