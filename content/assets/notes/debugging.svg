<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450" role="img" aria-labelledby="title desc"><title id="title">把“有问题”缩到具体环节</title><desc id="desc">先找到失败的位置，再选择改动。</desc><defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#c5d9d2" stroke-width=".6" opacity=".4"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#13796c" stroke-width="1.7"/></marker></defs><rect width="1100" height="450" rx="20" fill="#f2f6f1"/><rect width="1100" height="450" rx="20" fill="url(#grid)"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="28" y="38" fill="#13796c" font-size="13" font-weight="600" text-anchor="start">DIAGNOSIS</text><text x="28" y="80" fill="#173b42" font-size="32" font-weight="700" text-anchor="start">把“有问题”缩到具体环节</text><text x="28" y="112" fill="#4b6970" font-size="18" font-weight="400" text-anchor="start">先找到失败的位置，再选择改动。</text><rect x="28.0" y="156" width="329.3333333333333" height="176" rx="13" fill="#fff" stroke="#b5ccc5"/><rect x="28.0" y="171" width="3" height="146" rx="1.5" fill="#13796c"/><text x="46.0" y="188" fill="#13796c" font-size="13" font-weight="600" text-anchor="start">01</text><text x="46.0" y="221" fill="#173b42" font-size="24" font-weight="700" text-anchor="start">描述现象</text><text x="46.0" y="250" fill="#4b6970" font-size="18" font-weight="400" text-anchor="start">设备 / 操作 / 截图</text><text x="46.0" y="279" fill="#4b6970" font-size="18" font-weight="400" text-anchor="start">什么情况下会出现</text><path d="M360.3333333333333 242H379.3333333333333" fill="none" stroke="#13796c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="385.3333333333333" y="156" width="329.3333333333333" height="176" rx="13" fill="#fff" stroke="#b5ccc5"/><rect x="385.3333333333333" y="171" width="3" height="1