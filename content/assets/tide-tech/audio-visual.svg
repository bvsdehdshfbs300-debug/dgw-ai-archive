<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="710" viewBox="0 0 1100 710" role="img" aria-labelledby="title desc"><title id="title">PCM 同源音画联动示意</title><desc id="desc">PCM 采样一支进入音量与 HDMI 音频桥接，另一支提取总包络与三频段响应，用于潮汐动效和 LED。</desc><defs><marker id="green-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#157c76"/></marker><marker id="blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#3565a8"/></marker><marker id="gold-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a26c1a"/></marker></defs><rect width="1100" height="710" rx="20" fill="#f1f7f5"/><g font-family="Segoe UI,Microsoft YaHei,system-ui,sans-serif"><text x="40" y="48" font-size="27" fill="#173b3d" text-anchor="start" font-weight="700">04 / 同一个 PCM 采样源，驱动声音、潮汐与灯光</text><text x="40" y="82" font-size="18" fill="#587278" text-anchor="start" font-weight="400">音频输出和视觉反馈各走自己的支路，在作品里形成同源联动</text><rect x="40" y="265" width="200" height="110" rx="14" fill="#ffffff" stroke="#a9c8c6"/><rect x="40" y="283" width="4" height="74" rx="2" fill="#3565a8"/><text x="140.0" y="317.0" font-size="21" fill="#3565a8" text-anchor="middle" font-weight="650">TF 音乐流</text><text x="140.0" y="348.0" font-size="16" fill="#587278" text-anchor="middle" font-weight="400">PCM 采样</text><rect x="330" y="135" width="290" height="100" rx="14" fill="#ffffff" stroke="#a9c8c6"/><rect x="330" y="153" width="4" height="64" rx="2" fill="#3565a8"/><text x="475.0" y="182.0" font-size="21" fill="#3565a8" text-anchor="middle" font-weight="650">音量处理 + PCM 桥接</text><text x="475.0" y="213.0" font-size="16" fill="#587278" text-anchor="middle" font-weight="400">跨入视频 / HDMI 域</text><rect x="760" y="135" width="290" height="100" rx="14" fill="#ffffff" stroke="#a9c8c6"/><rect x="760" y="153" width="4" height="64" rx="2" fill="#3565a8"/><text x="905.0" y="182.0" font-size="21" fill="#3565a8" text-anchor="middle" font-weight="650">HDMI 音频包</text><text x="905.0" y="213.0" font-size="16" fill="#587278" text-anchor="middle" font-weight="400">声音输出</text><rect x="330" y="400" width="290" height="125" rx="14" fill="#ffffff" stroke="#a9c8c6"/><rect x="330" y="418" width="4" height="89" rx="2" fill="#157c76"/><text x="475.0" y="459.5" font-size="21" fill="#157c76" text-anchor="middle" font-weight="650">包络与频段响应</text><text x="475.0" y="490.5" font-size="16" fill="#587278" text-anchor="middle" font-weight="400">低频 / 中频 / 高频</text><rect x="760" y="340" width="290" height="100" rx="14" fill="#ffffff" stroke="#a9c8c6"/><rect x="760" y="358" width="4" height="64" rx="2" fill="#157c76"/><text x="905.0" y="387.0" font-size="21" fill="#157c76" text-anchor="middle" font-weight="650">潮汐与画面参数</text><text x="905.0" y="418.0" font-size="16" fill="#587278" text-anchor="middle" font-weight="400">波幅 / 起伏 / 视觉层次</text><rect x="760" y="535" width="290" height="100" rx="14" fill="#ffffff" stroke="#a9c8c6"/><rect x="760" y="553" width="4" height="64" rx="2" fill="#157c76"/><text x="905.0" y="582.0" font-size="21" fill="#157c76" text-anchor="middle" font-weight="650">板载 LED</text><text x="905.0" y="613.0" font-size="16" fill="#587278" text-anchor="middle" font-weight="400">能量与节奏反馈</text><polyline points="240,320 280,320 280,185 330,185" fill="none" stroke="#3565a8" stroke-width="2.6" marker-end="url(#blue-arrow)"/><polyline points="620,185 760,185" fill="none" stroke="#3565a8" stroke-width="2.6" marker-end="url(#blue-arrow)"/><polyline points="240,320 280,320 280,462 330,462" fill="none" stroke="#157c76" stroke-width="2.6" marker-end="url(#green-arrow)"/><polyline points="620,462 690,462 690,390 760,390" fill="none" stroke="#157c76" stroke-width="2.6" marker-end="url(#green-arrow)"/><polyline points="620,462 690,462 690,585 760,585" fill="none" stroke="#157c76" stroke-width="2.6" marker-end="url(#green-arrow)"/><text x="40" y="677" font-size="16" fill="#587278" text-anchor="start" font-weight="400">频段响应来自滤波与幅值包络；此图说明信号来源与路径，不代表 FFT 频谱或实测同步延迟。</text></g></svg>