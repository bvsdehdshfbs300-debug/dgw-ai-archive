<svg xmlns="http://www.w3.org/2000/svg" width="420" height="975" viewBox="0 0 420 975" role="img" aria-labelledby="title desc"><title id="title">PCM 音画联动竖版</title><desc id="desc">共享 PCM 音频源分别进入声音输出与包络反馈，包络反馈并行驱动潮汐画面和 LED。</desc><defs><marker id="green-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#157c76"/></marker><marker id="blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#3565a8"/></marker><marker id="gold-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a26c1a"/></marker></defs><rect width="420" height="975" rx="20" fill="#f1f7f5"/><g font-family="Segoe UI,Microsoft YaHei,system-ui,sans-serif"><text x="25" y="42" font-size="26" fill="#173b3d" text-anchor="start" font-weight="700">同源音画联动</text><text x="25" y="75" font-size="18" fill="#587278" text-anchor="start" font-weight="400">音乐不只被播放，也参与画面</text><rect x="25" y="115" width="370" height="105" rx="14" fill="#ffffff" stroke="#a9c8c6"/><rect x="25" y="133" width="4" height="69" rx="2" fill="#3565a8"/><text x="210.0" y="164.5" font-size="21" fill="#3565a8" text-anchor="middle" font-weight="650">TF 音乐流</text><text x="210.0" y="195.5" font-size="16" fill="#587278" text-anchor="middle" font-weight="400">同一个 PCM 采样源</text><polyline points="210,220 210,270" fill="none" stroke="#3565a8" stroke-width="2.6" marker-end="url(#blue-arrow)"/><rect x="25" y="280" width="370" height="105" rx="14" fill="#ffffff" stroke="#a9c8c6"/><rect x="25" y="298" width="4" height="69" rx="2" fill="#3565a8"/><text x="210.0" y="329.5" font-size="21" fill="#3565a8" text-anchor="middle" font-weight="650">声音支路</text><text x="210.0" y="360.5" font-size="16" fill="#587278" text-anchor="middle" font-weight="400">音量 → 跨域桥接 → HDMI</text><polyline points="55,220 12,220 12,460 25,460" fill="none" stroke="#157c76" stroke-width="2.6" marker-end="url(#green-arrow)"/><rect x="25" y="415" width="370" height="105" rx="14" fill="#ffffff" stroke="#a9c8c6"/><rect x="25" y="433" width="4" height="69" rx="2" fill="#157c76"/><text x="210.0" y="464.5" font-size="21" fill="#157c76" text-anchor="middle" font-weight="650">反馈支路</text><text x="210.0" y="495.5" font-size="16" fill="#587278" text-anchor="middle" font-weight="400">总包络 + 低 / 中 / 高频响应</text><polyline points="210,520 210,565" fill="none" stroke="#157c76" stroke-width="2.6" marker-end="url(#green-arrow)"/><rect x="25" y="580" width="370" height="105" rx="14" fill="#ffffff" stroke="#a9c8c6"/><rect x="25" y="598" width="4" height="69" rx="2" fill="#157c76"/><text x="210.0" y="629.5" font-size="21" fill="#157c76" text-anchor="middle" font-weight="650">潮汐与画面参数</text><text x="210.0" y="660.5" font-size="16" fill="#587278" text-anchor="middle" font-weight="400">波幅 / 起伏 / 视觉层次</text><polyline points="55,520 12,520 12,797 25,797" fill="none" stroke="#157c76" stroke-width="2.6" marker-end="url(#green-arrow)"/><rect x="25" y="745" width="370" height="105" rx="14" fill="#ffffff" stroke="#a9c8c6"/><rect x="25" y="763" width="4" height="69" rx="2" fill="#157c76"/><text x="210.0" y="794.5" font-size="21" fill="#157c76" text-anchor="middle" font-weight="650">板载 LED</text><text x="210.0" y="825.5" font-size="16" fill="#587278" text-anchor="middle" font-weight="400">能量与节奏反馈</text><text x="25" y="903" font-size="17" fill="#587278" text-anchor="start" font-weight="400">视觉与 LED 均由反馈支路驱动。</text><text x="25" y="937" font-size="16" fill="#587278" text-anchor="start" font-weight="400">纵向排列仅为手机阅读，非串联时序。</text></g></svg>