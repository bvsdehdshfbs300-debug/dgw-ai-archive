<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="675" viewBox="0 0 1100 675" role="img" aria-labelledby="title desc"><title id="title">FPGA 最近邻实时缩放地址映射</title><desc id="desc">选取 640×480 原图中央 320×240，源坐标加上 160、120 偏移后按输出坐标除二，形成两倍最近邻放大。</desc><defs><marker id="green-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#157c76"/></marker><marker id="blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#3565a8"/></marker><marker id="gold-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a26c1a"/></marker></defs><rect width="1100" height="675" rx="20" fill="#f1f7f5"/><g font-family="Segoe UI,Microsoft YaHei,system-ui,sans-serif"><text x="45" y="48" font-size="27" fill="#173b3d" text-anchor="start" font-weight="700">02 / 改变读地址，让四个场景共用一套缩放器</text><text x="45" y="84" font-size="18" fill="#587278" text-anchor="start" font-weight="400">中央取景 → 最近邻像素复制 → 保持输出画布</text><text x="215" y="140" font-size="22" fill="#173b3d" text-anchor="middle" font-weight="650">原图 640 × 480</text><rect x="55" y="165" width="320" height="240" rx="5" fill="#dceae7" stroke="#a9c8c6"/><path d="M55 205Q155 175 375 220" fill="none" stroke="#b2cfcb" stroke-width="2"/><path d="M55 235Q155 205 375 250" fill="none" stroke="#b2cfcb" stroke-width="2"/><path d="M55 265Q155 235 375 280" fill="none" stroke="#b2cfcb" stroke-width="2"/><path d="M55 295Q155 265 375 310" fill="none" stroke="#b2cfcb" stroke-width="2"/><path d="M55 325Q155 295 375 340" fill="none" stroke="#b2cfcb" stroke-width="2"/><rect x="135" y="225" width="80" height="60" rx="0" fill="#8ec5b4" stroke="#ffffff"/><text x="175" y="264" font-size="23" fill="#173b3d" text-anchor="middle" font-weight="700">A</text><rect x="215" y="225" width="80" height="60" rx="0" fill="#abc5df" stroke="#ffffff"/><text x="255" y="264" font-size="23" fill="#173b3d" text-anchor="middle" font-weight="700">B</text><rect x="135" y="285" width="80" height="60" rx="0" fill="#dfc99a" stroke="#ffffff"/><text x="175" y="324" font-size="23" fill="#173b3d" text-anchor="middle" font-weight="700">C</text><rect x="215" y="285" width="80" height="60" rx="0" fill="#c8b5d6" stroke="#ffffff"/><text x="255" y="324" font-size="23" fill="#173b3d" text-anchor="middle" font-weight="700">D</text><rect x="135" y="225" width="160" height="120" fill="none" stroke="#157c76" stroke-width="3" stroke-dasharray="8 5"/><text x="215" y="439" font-size="20" fill="#157c76" text-anchor="middle" font-weight="400">中央 320 × 240 区域</text><text x="215" y="470" font-size="18" fill="#587278" text-anchor="middle" font-weight="400">起点 (160, 120)</text><polyline points="420,283 600,283" fill="none" stroke="#157c76" stroke-width="2.6" marker-end="url(#green-arrow)"/><text x="510" y="255" font-size="20" fill="#157c76" text-anchor="middle" font-weight="650">地址映射</text><text x="510" y="320" font-size="16" fill="#587278" text-anchor="middle" font-weight="400">每点横纵各复制两次</text><text x="820" y="140" font-size="22" fill="#173b3d" text-anchor="middle" font-weight="650">输出 640 × 480</text><rect x="660" y="165" width="80" height="60" rx="0" fill="#8ec5b4" stroke="#ffffff"/><text x="700" y="204" font-size="23" fill="#173b3d" text-anchor="middle" font-weight="700">A</text><rect x="740" y="165" width="80" height="60" rx="0" fill="#8ec5b4" stroke="#ffffff"/><text x="780" y="204" font-size="23" fill="#173b3d" text-anchor="middle" font-weight="700">A</text><rect x="820" y="165" width="80" height="60" rx="0" fill="#abc5df" stroke="#ffffff"/><text x="860" y="204" font-size="23" fill="#173b3d" text-anchor="middle" font-weight="700">B</text><rect x="900" y="165" width="80" height="60" rx="0" fill="#abc5df" stroke="#ffffff"/><text x="940" y="204" font-size="23" fill="#173b3d" text-anchor="middle" font-weight="700">B</text><rect x="660" y="225" width="80" height="60" rx="0" fill="#8ec5b4" stroke="#ffffff"/><text x="700" y="264" font-size="23" fill="#173b3d" text-anchor="middle" font-weight="700">A</text><rect x="740" y="225" width="80" height="60" rx="0" fill="#8ec5b4" stroke="#ffffff"/><text x="780" y="264" font-size="23" fill="#173b3d" text-anchor="middle" font-weight="700">A</text><rect x="820" y="225" width="80" height="60" rx="0" fill="#abc5df" stroke="#ffffff"/><text x="860" y="264" font-size="23" fill="#173b3d" text-anchor="middle" font-weight="700">B</text><rect x="900" y="225" width="80" height="60" rx="0" fill="#abc5df" stroke="#ffffff"/><text x="940" y="264" font-size="23" fill="#173b3d" text-anchor="middle" font-weight="700">B</text><rect x="660" y="285" width="80" height="60" rx="0" fill="#dfc99a" stroke="#ffffff"/><text x="700" y="324" font-size="23" fill="#173b3d" text-anchor="middle" font-weight="700">C</text><rect x="740" y="285" width="80" height="60" rx="0" fill="#dfc99a" stroke="#ffffff"/><text x="780" y="324" font-size="23" fill="#173b3d" text-anchor="middle" font-weight="700">C</text><rect x="820" y="285" width="80" height="60" rx="0" fill="#c8b5d6" stroke="#ffffff"/><text x="860" y="324" font-size="23" fill="#173b3d" text-anchor="middle" font-weight="700">D</text><rect x="900" y="285" width="80" height="60" rx="0" fill="#c8b5d6" stroke="#ffffff"/><text x="940" y="324" font-size="23" fill="#173b3d" text-anchor="middle" font-weight="700">D</text><rect x="660" y="345" width="80" height="60" rx="0" fill="#dfc99a" stroke="#ffffff"/><text x="700" y="384" font-size="23" fill="#173b3d" text-anchor="middle" font-weight="700">C</text><rect x="740" y="345" width="80" height="60" rx="0" fill="#dfc99a" stroke="#ffffff"/><text x="780" y="384" font-size="23" fill="#173b3d" text-anchor="middle" font-weight="700">C</text><rect x="820" y="345" width="80" height="60" rx="0" fill="#c8b5d6" stroke="#ffffff"/><text x="860" y="384" font-size="23" fill="#173b3d" text-anchor="middle" font-weight="700">D</text><rect x="900" y="345" width="80" height="60" rx="0" fill="#c8b5d6" stroke="#ffffff"/><text x="940" y="384" font-size="23" fill="#173b3d" text-anchor="middle" font-weight="700">D</text><text x="820" y="439" font-size="20" fill="#157c76" text-anchor="middle" font-weight="400">A → 2 × 2 输出像素</text><text x="820" y="470" font-size="18" fill="#587278" text-anchor="middle" font-weight="400">无需新增放大图素材</text><rect x="55" y="505" width="925" height="96" rx="14" fill="#ffffff" stroke="#a9c8c6"/><text x="85" y="545" font-size="23" fill="#157c76" text-anchor="start" font-weight="650">x源 = 160 + floor(x输出 / 2)</text><text x="85" y="579" font-size="23" fill="#157c76" text-anchor="start" font-weight="650">y源 = 120 + floor(y输出 / 2)</text><text x="55" y="642" font-size="17" fill="#587278" text-anchor="start" font-weight="400">像素块为原理示意，并非截图；最终公式还需叠加当前场景的帧区基址。</text></g></svg>