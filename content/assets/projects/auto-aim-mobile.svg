<svg xmlns="http://www.w3.org/2000/svg" width="460" height="1000" viewBox="0 0 460 1000" role="img" aria-labelledby="title desc"><title id="title">电赛实践｜简易自行瞄准装置数据流</title><desc id="desc">依据项目资料整理的功能关系图，不是实测曲线。</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#b7cec5" stroke-width=".5" opacity=".35"/></pattern><marker id="arr" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#4e648f" stroke-width="1.6"/></marker></defs><rect width="460" height="1000" rx="20" fill="#f4f7f2"/><rect width="460" height="1000" rx="20" fill="url(#grid)"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="28" y="38" fill="#4e648f" font-size="14" font-weight="600">DGW / 视觉与运动控制</text><text x="28" y="83" fill="#173d43" font-size="25" font-weight="700">电赛实践</text><text x="28" y="116" fill="#506e73" font-size="17" font-weight="400">从输入到反馈，逐段理解这件作品。</text><rect x="28" y="156" width="404" height="146" rx="13" fill="white" stroke="#b8cdc4"/><path d="M28 174V284" stroke="#4e648f" stroke-width="3"/><text x="47" y="184" fill="#4e648f" font-size="13" font-weight="600">01</text><text x="47" y="219" fill="#173d43" font-size="23" font-weight="700">目标画面</text><text x="47" y="250" fill="#49676c" font-size="18" font-weight="400">矩形与角点</text><text x="47" y="278" fill="#49676c" font-size="18" font-weight="400">有效目标筛选</text><path d="M230 307V321" fill="none" stroke="#4e648f" stroke-width="2" marker-end="url(#arr)"/><rect x="28" y="328" width="404" height="146" rx="13" fill="white" stroke="#b8cdc4"/><path d="M28 346V456" stroke="#4e648f" stroke-width="3"/><text x="47" y="356" fill="#4e648f" font-size="13" font-weight="600">02</text><text x="47" y="391" fill="#173d43" font-size="23" font-weight="700">位置估计</text><text x="47" y="422" fill="#49676c" font-size="18" font-weight="400">排序与中心</text><text x="47" y="450" fill="#49676c" font-size="18" font-weight="400">透视坐标关系</text><path d="M230 479V493" fill="none" stroke="#4e648f" stroke-width="2" marker-end="url(#arr)"/><rect x="28" y="500" width="404" height="146" rx="13" fill="white" stroke="#b8cdc4"/><path d="M28 518V628" stroke="#4e648f" stroke-width="3"/><text x="47" y="528" fill="#4e648f" font-size="13" font-weight="600">03</text><text x="47" y="563" fill="#173d43" font-size="23" font-weight="700">控制计算</text><text x="47" y="594" fill="#49676c" font-size="18" font-weight="400">偏差与 PID</text><text x="47" y="622" fill="#49676c" font-size="18" font-weight="400">限幅与参数调整</text><path d="M230 651V665" fill="none" stroke="#4e648f" stroke-width="2" marker-end="url(#arr)"/><rect x="28" y="672" width="404" height="146" rx="13" fill="white" stroke="#b8cdc4"/><path d="M28 690V800" stroke="#4e648f" stroke-width="3"/><text x="47" y="700" fill="#4e648f" font-size="13" font-weight="600">04</text><text x="47" y="735" fill="#173d43" font-size="23" font-weight="700">双轴动作</text><text x="47" y="766" fill="#49676c" font-size="18" font-weight="400">运动执行</text><text x="47" y="794" fill="#49676c" font-size="18" font-weight="400">下一帧再观察</text><text x="28" y="886" fill="#4e648f" font-size="17" font-weight="600">闭环：动作改变画面，下一帧继续校正</text><text x="28" y="977" fill="#506e73" font-size="12" font-weight="400">地瓜丸 · 项目关系图 / 非实测图表</text></g></svg>