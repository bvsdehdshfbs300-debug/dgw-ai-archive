<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">AI 监控台｜从悬浮窗到用量仪表数据流</title><desc id="desc">依据项目资料整理的功能关系图，不是实测曲线。</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#b7cec5" stroke-width=".5" opacity=".35"/></pattern><marker id="arr" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#866036" stroke-width="1.6"/></marker></defs><rect width="1100" height="560" rx="20" fill="#f4f7f2"/><rect width="1100" height="560" rx="20" fill="url(#grid)"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="28" y="38" fill="#866036" font-size="14" font-weight="600">DGW / 软件工具</text><text x="28" y="83" fill="#173d43" font-size="32" font-weight="700">AI 监控台</text><text x="28" y="116" fill="#506e73" font-size="17" font-weight="400">从输入到反馈，逐段理解这件作品。</text><rect x="28" y="184" width="237" height="185" rx="13" fill="white" stroke="#b8cdc4"/><path d="M28 202V351" stroke="#866036" stroke-width="3"/><text x="47" y="212" fill="#866036" font-size="13" font-weight="600">01</text><text x="47" y="247" fill="#173d43" font-size="23" font-weight="700">不同数据源</text><text x="47" y="278" fill="#49676c" font-size="18" font-weight="400">客户端会话</text><text x="47" y="306" fill="#49676c" font-size="18" font-weight="400">余额与本机状态</text><path d="M270 275H290" fill="none" stroke="#866036" stroke-width="2" marker-end="url(#arr)"/><rect x="297" y="184" width="237" height="185" rx="13" fill="white" stroke="#b8cdc4"/><path d="M297 202V351" stroke="#866036" stroke-width="3"/><text x="316" y="212" fill="#866036" font-size="13" font-weight="600">02</text><text x="316" y="247" fill="#173d43" font-size="23" font-weight="700">适配与增量读取</text><text x="316" y="278" fill="#49676c" font-size="18" font-weight="400">字段归一</text><text x="316" y="306" fill="#49676c" font-size="18" font-weight="400