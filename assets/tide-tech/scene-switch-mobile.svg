<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1050" viewBox="0 0 420 1050" role="img" aria-labelledby="title desc"><title id="title">转场状态提交竖版</title><desc id="desc">四个阶段依次为旧画面、遮挡加深、完全遮挡提交状态和新画面显露。</desc><defs><marker id="green-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#157c76"/></marker><marker id="blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#3565a8"/></marker><marker id="gold-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a26c1a"/></marker></defs><rect width="420" height="1050" rx="20" fill="#f1f7f5"/><g font-family="Segoe UI,Microsoft YaHei,system-ui,sans-serif"><text x="25" y="42" font-size="25" fill="#173b3d" text-anchor="start" font-weight="700">转场与状态提交</text><text x="25" y="75" font-size="18" fill="#587278" text-anchor="start" font-weight="400">让画面切换有明确的时机</text><rect x="25" y="110" width="370" height="120" rx="14" fill="#ffffff" stroke="#a9c8c6"/><rect x="25" y="128" width="4" height="84" rx="2" fill="#157c76"/><text x="210.0" y="167.0" font-size="21" fill="#157c76" text-anchor="middle" font-weight="650">旧画面</text><text x="210.0" y="198.0" font-size="16" fill="#587278" text-anchor="middle" font-weight="400">保持当前显示状态</text><polyline points="210,230 210,283" fill="none" stroke="#157c76" stroke-width="2.6" marker-end="url(#green-arrow)"/><rect x="25" y="290" width="370" height="120" rx="14" fill="#ffffff" stroke="#a9c8c6"/><rect x="25" y="308" width="4" height="84" rx="2" fill="#157c76"/><text x="210.0" y="347.0" font-size="21" fill="#157c76" text-anchor="middle" font-weight="650">遮挡加深</text><text x="210.0" y="378.0" font-size="16" fill="#587278" text-anchor="middle" font-weight="400">准备下一组状态</text><polyline points="210,410 210,463" fill="none" stroke="#157c76" stroke-width="2.6" marker-end="url(#green-arrow)"/><rect x="25" y="470" width="370" height="120" rx="14" fill="#ffffff" stroke="#a9c8c6"/><rect x="25" y="488" width="4" height="84" rx="2" fill="#a26c1a"/><text x="210.0" y="527.0" font-size="21" fill="#a26c1a" text-anchor="middle" font-weight="650">完全遮挡</text><text x="210.0" y="558.0" font-size="16" fill="#587278" text-anchor="middle" font-weight="400">提交场景 / 缩放状态</text><polyline points="210,590 210,643" fill="none" stroke="#157c76" stroke-width="2.6" marker-end="url(#green-arrow)"/><rect x="25" y="650" width="370" height="120" rx="14" fill="#ffffff" stroke="#a9c8c6"/><rect x="25" y="668" width="4" height="84" rx="2" fill="#157c76"/><text x="210.0" y="707.0" font-size="21" fill="#157c76" text-anchor="middle" font-weight="650">新画面显露</text><text x="210.0" y="738.0" font-size="16" fill="#587278" text-anchor="middle" font-weight="400">以新的状态继续输出</text><rect x="25" y="870" width="370" height="115" rx="14" fill="#ffffff" stroke="#a9c8c6"/><text x="45" y="908" font-size="21" fill="#157c76" text-anchor="start" font-weight="650">核心做法</text><text x="45" y="945" font-size="18" fill="#173b3d" text-anchor="start" font-weight="400">覆盖保持 → 提交状态 → 展开</text><text x="25" y="1025" font-size="16" fill="#587278" text-anchor="start" font-weight="400">流程示意，不表示实测时序</text></g></svg>