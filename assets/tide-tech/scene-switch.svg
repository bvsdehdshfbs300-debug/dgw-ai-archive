<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="670" viewBox="0 0 1100 670" role="img" aria-labelledby="title desc"><title id="title">转场遮挡与状态提交示意</title><desc id="desc">先覆盖旧画面，在完全遮挡的保持区间更新场景与缩放状态，之后显露新画面。</desc><defs><marker id="green-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#157c76"/></marker><marker id="blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#3565a8"/></marker><marker id="gold-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a26c1a"/></marker></defs><rect width="1100" height="670" rx="20" fill="#f1f7f5"/><g font-family="Segoe UI,Microsoft YaHei,system-ui,sans-serif"><text x="40" y="48" font-size="27" fill="#173b3d" text-anchor="start" font-weight="700">03 / 把状态切换放进转场遮挡窗口</text><text x="40" y="82" font-size="18" fill="#587278" text-anchor="start" font-weight="400">请求、覆盖、提交、展开分别有自己的时机</text><rect x="40" y="140" width="225" height="145" rx="14" fill="#c8dfdb" stroke="#a9c8c6"/><text x="152" y="325" font-size="22" fill="#173b3d" text-anchor="middle" font-weight="650">旧画面</text><text x="152" y="357" font-size="17" fill="#587278" text-anchor="middle" font-weight="400">保持当前显示状态</text><polyline points="274,212 298,212" fill="none" stroke="#157c76" stroke-width="2.6" marker-end="url(#green-arrow)"/><rect x="307" y="140" width="225" height="145" rx="14" fill="#c8dfdb" stroke="#a9c8c6"/><circle cx="419" cy="212" r="61" fill="#1b353c"/><text x="419" y="325" font-size="22" fill="#173b3d" text-anchor="middle" font-weight="650">遮挡加深</text><text x="419" y="357" font-size="17" fill="#587278" text-anchor="middle" font-weight="400">准备下一组状态</text><polyline points="541,212 565,212" fill="none" stroke="#157c76" stroke-width="2.6" marker-end="url(#green-arrow)"/><rect x="574" y="140" width="225" height="145" rx="14" fill="#b9cfe5" stroke="#a9c8c6"/><rect x="574" y="140" width="225" height="145" rx="14" fill="#1b353c" stroke="#1b353c"/><text x="686" y="220" font-size="22" fill="#c6f0df" text-anchor="middle" font-weight="700">COMMIT</text><text x="686" y="325" font-size="22" fill="#173b3d" text-anchor="middle" font-weight="650">完全遮挡</text><text x="686" y="357" font-size="17" fill="#587278" text-anchor="middle" font-weight="400">提交场景 / 缩放状态</text><polyline points="808,212 832,212" fill="none" stroke="#157c76" stroke-width="2.6" marker-end="url(#green-arrow)"/><rect x="841" y="140" width="225" height="145" rx="14" fill="#b9cfe5" stroke="#a9c8c6"/><circle cx="953" cy="212" r="38" fill="#1b353c"/><text x="953" y="325" font-size="22" fill="#173b3d" text-anchor="middle" font-weight="650">新画面显露</text><text x="953" y="357" font-size="17" fill="#587278" text-anchor="middle" font-weight="400">以新的状态继续输出</text><rect x="40" y="410" width="1025" height="150" rx="14" fill="#ffffff" stroke="#a9c8c6"/><text x="65" y="447" font-size="17" fill="#587278" text-anchor="start" font-weight="400">遮挡程度</text><path d="M75 530 L290 530 L470 465 L710 465 L890 530 L1035 530" fill="none" stroke="#157c76" stroke-width="3"/><line x1="650" y1="450" x2="650" y2="540" stroke="#a26c1a" stroke-width="2" stroke-dasharray="6 5"/><text x="650" y="590" font-size="21" fill="#a26c1a" text-anchor="middle" font-weight="650">在覆盖保持区间更新显示状态</text><text x="40" y="637" font-size="17" fill="#587278" text-anchor="start" font-weight="400">流程示意，横轴不表示实测时间；不同转场共用受控的状态切换过程。</text></g></svg>