<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1080" viewBox="0 0 420 1080" role="img" aria-labelledby="title desc"><title id="title">潮汐作曲家系统架构竖版</title><desc id="desc">图像数据从 TF、四帧缓存、地址映射、像素合成进入 HDMI；音频另有输出与反馈支路。</desc><defs><marker id="green-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#157c76"/></marker><marker id="blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#3565a8"/></marker><marker id="gold-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a26c1a"/></marker></defs><rect width="420" height="1080" rx="20" fill="#f1f7f5"/><g font-family="Segoe UI,Microsoft YaHei,system-ui,sans-serif"><text x="24" y="40" font-size="26" fill="#173b3d" text-anchor="start" font-weight="700">系统架构</text><text x="24" y="70" font-size="17" fill="#587278" text-anchor="start" font-weight="400">图像主链路 + 音频支路</text><rect x="25" y="105" width="370" height="100" rx="14" fill="#ffffff" stroke="#a9c8c6"/><rect x="25" y="123" width="4" height="64" rx="2" fill="#157c76"/><text x="210.0" y="152.0" font-size="21" fill="#157c76" text-anchor="middle" font-weight="650">TF 卡素材</text><text x="210.0" y="183.0" font-size="16" fill="#587278" text-anchor="middle" font-weight="400">图像与音乐读取</text><polyline points="210,205 210,243" fill="none" stroke="#157c76" stroke-width="2.6" marker-end="url(#green-arrow)"/><rect x="25" y="245" width="370" height="100" rx="14" fill="#ffffff" stroke="#a9c8c6"/><rect x="25" y="263" width="4" height="64" rx="2" fill="#157c76"/><text x="210.0" y="292.0" font-size="21" fill="#157c76" text-anchor="middle" font-weight="650">四帧常驻 SDRAM</text><text x="210.0" y="323.0" font-size="16" fill="#587278" text-anchor="middle" font-weight="400">晨潮 / 晴海 / 暮港 / 夜航</text><polyline points="210,345 210,383" fill="none" stroke="#157c76" stroke-width="2.6" marker-end="url(#green-arrow)"/><rect x="25" y="385" width="370" height="100" rx="14" fill="#ffffff" stroke="#a9c8c6"/><rect x="25" y="403" width="4" height="64" rx="2" fill="#157c76"/><text x="210.0" y="432.0" font-size="21" fill="#157c76" text-anchor="middle" font-weight="650">显示读地址映射</text><text x="210.0" y="463.0" font-size="16" fill="#587278" text-anchor="middle" font-weight="400">1× 原图 / 2× 中心放大</text><polyline points="210,485 210,523" fill="none" stroke="#157c76" stroke-width="2.6" marker-end="url(#green-arrow)"/><rect x="25" y="525" width="370" height="100" rx="14" fill="#ffffff" stroke="#a9c8c6"/><rect x="25" y="543" width="4" height="64" rx="2" fill="#157c76"/><text x="210.0" y="572.0" font-size="21" fill="#157c76" text-anchor="middle" font-weight="650">像素合成</text><text x="210.0" y="603.0" font-size="16" fill="#587278" text-anchor="middle" font-weight="400">转场 / OSD / 亮度与对比度</text><polyline points="210,625 210,663" fill="none" stroke="#157c76" stroke-width="2.6" marker-end="url(#green-arrow)"/><rect x="25" y="665" width="370" height="100" rx="14" fill="#ffffff" stroke="#a9c8c6"/><rect x="25" y="683" width="4" height="64" rx="2" fill="#157c76"/><text x="210.0" y="712.0" font-size="21" fill="#157c76" text-anchor="middle" font-weight="650">HDMI 输出</text><text x="210.0" y="743.0" font-size="16" fill="#587278" text-anchor="middle" font-weight="400">图像与音频汇合</text><rect x="25" y="840" width="370" height="170" rx="14" fill="#ffffff" stroke="#3565a8"/><text x="45" y="875" font-size="22" fill="#3565a8" text-anchor="start" font-weight="650">音频支路</text><text x="45" y="914" font-size="19" fill="#173b3d" text-anchor="start" font-weight="400">PCM → HDMI 音频包</text><text x="45" y="950" font-size="19" fill="#173b3d" text-anchor="start" font-weight="400">包络 → 潮汐动效 / LED</text><text x="45" y="984" font-size="17" fill="#587278" text-anchor="start" font-weight="400">按键状态控制场景与转场</text><text x="25" y="1054" font-size="16" fill="#587278" text-anchor="start" font-weight="400">模块关系示意，非实际电路接线图</text></g></svg>