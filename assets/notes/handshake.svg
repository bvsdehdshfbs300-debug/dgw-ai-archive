c5"/><rect x="28" y="419" width="3" height="82" rx="1.5" fill="#13796c"/><text x="46" y="436" fill="#173b42" font-size="24" font-weight="700" text-anchor="start">第 4 拍、第 6 拍</text><text x="46" y="465" fill="#4b6970" font-size="18" font-weight="400" text-anchor="start">其余周期没有完成握手。</text><rect x="564" y="404" width="508" height="112" rx="13" fill="#fff" stroke="#b5ccc5"/><rect x="564" y="419" width="3" height="82" rx="1.5" fill="#13796c"/><text x="582" y="436" fill="#173b42" font-size="24" font-weight="700" text-anchor="start">接着处理真实阻力</text><text x="582" y="465" fill="#4b6970" font-size="18" font-weight="400" text-anchor="start">停顿保持 → 缓冲 → 跨时钟 → 校验</text><text x="28" y="568" fill="#4b6970" font-size="12" font-weight="400" text-anchor="start">地瓜丸 · 作品与方法 / 内容关系示意</text></g></svg>