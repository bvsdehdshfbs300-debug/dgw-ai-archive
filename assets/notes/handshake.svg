<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc"><title id="title">哪一拍，数据才算传过去？</title><desc id="desc">两者都为 1，才在该上升沿完成传输。</desc><defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#c5d9d2" stroke-width=".6" opacity=".4"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#13796c" stroke-width="1.7"/></marker></defs><rect width="1100" height="590" rx="20" fill="#f2f6f1"/><rect width="1100" height="590" rx="20" fill="url(#grid)"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="28" y="38" fill="#13796c" font-size="13" font-weight="600" text-anchor="start">READY / VALID</text><text x="28" y="80" fill="#173b42" font-size="32" font-weight="700" text-anchor="start">哪一拍，数据才算传过去？</text><text x="28" y="112" fill="#4b6970" font-size="18" font-weight="400" text-anchor="start">两者都为 1，才在该上升沿完成传输。</text><path d="M164 158V365" fill="none" stroke="#c8d9d3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="206.0" y="151" fill="#4b6970" font-size="13" font-weight="400" text-anchor="middle">1</text><path d="M269 158V365" fill="none" stroke="#c8d9d3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="311.0" y="151" fill="#4b6970" font-size="13" font-weight="400" text-anchor="middle">2</text><path d="M374 158V365" fill="none" stroke="#c8d9d3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="416.0" y="151" fill="#4b6970" font-size="13" font-weight="400" text-anchor="middle">3</text><path d="M479 158V365" fill="none" stroke="#c8d9d3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="521.0" y="151" fill="#4b6970" font-size="13" font-weight="400" text-anchor="middle">4</text><rect x="479" y="160" width="105" height="212