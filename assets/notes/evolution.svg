<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc"><title id="title">一项反馈，接着一轮改进</title><desc id="desc">按功能阶段阅读，而不是比较更新次数。</desc><defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#c5d9d2" stroke-width=".6" opacity=".4"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#13796c" stroke-width="1.7"/></marker></defs><rect width="1100" height="610" rx="20" fill="#f2f6f1"/><rect width="1100" height="610" rx="20" fill="url(#grid)"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="28" y="38" fill="#13796c" font-size="13" font-weight="600" text-anchor="start">PROJECT EVOLUTION</text><text x="28" y="80" fill="#173b42" font-size="32" font-weight="700" text-anchor="start">一项反馈，接着一轮改进</text><text x="28" y="112" fill="#4b6970" font-size="18" font-weight="400" text-anchor="start">按功能阶段阅读，而不是比较更新次数。</text><path d="M50 205H1040" fill="none" stroke="#aac7bc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="50" cy="205" r="8" fill="#13796c" stroke="#13796c" stroke-width="2"/><text x="36" y="176" fill="#13796c" font-size="23" font-weight="700" text-anchor="start">2.0 / 2.1</text><rect x="28" y="246" width="240" height="183" rx="13" fill="#fff" stroke="#b5ccc5"/><rect x="28" y="261" width="3" height="153" rx="1.5" fill="#13796c"/><text x="46" y="278" fill="#173b42" font-size="24" font-weight="700" text-anchor="start">把波形看清</text><text x="46" y="307" fill="#4b6970" font-size="18" font-weight="400" text-anchor="start">时间窗口、测量</text><text x="46" y="336" fill="#4b6970" font-size="18" font-weight="400" text-anchor="start">与局部细节</text><circle cx="318" cy="205" r="8" fill="#13796c" stroke="#13796c" stroke-width="2"/><text x="304" y="176" fill="#13796c" font-size="23" font-weight="700" text-anchor="start">2.2</text><rect x="296" y="246" width="240" height="183" rx="13" fill="#fff" stroke="#b5ccc5"/><rect x="296" y="261" width="3" height="153" rx="1.5" fill="#13796c"/><text x="314" y="278" fill="#173b42" font-size="24" font-weight="700" text-anchor="start">让平台有温度</text><text x="314" y="307" fill="#4b6970" font-size="18" font-weight="400" text-anchor="start">平台脉搏、动态与充电</text><circle cx="586" cy="205" r="8" fill="#13796c" stroke="#13796c" stroke-width="2"/><text x="572" y="176" fill="#13796c" font-size="23" font-weight="700" text-anchor="start">3.0</text><rect x="564" y="246" width="240" height="183" rx="13" fill="#fff" stroke="#b5ccc5"/><rect x="564" y="261" width="3" height="153" rx="1.5" fill="#13796c"/><text x="582" y="278" fill="#173b42" font-size="24" font-weight="700" text-anchor="start">理解高速数据流</text><text x="582" y="307" fill="#4b6970" font-size="18" font-weight="400" text-anchor="start">握手、缓冲、跨域与校验</text><circle cx="854" cy="205" r="8" fill="#13796c" stroke="#13796c" stroke-width="2"/><text x="840" y="176" fill="#13796c" font-size="23" font-weight="700" text-anchor="start">4.1</text><rect x="832" y="246" width="240" height="183" rx="13" fill="#fff" stroke="#b5ccc5"/><rect x="832" y="261" width="3" height="153" rx="1.5" fill="#13796c"/><text x="850" y="278" fill="#173b42" font-size="24" font-weight="700" text-anchor="start">把外设放到桌面</text><text x="850" y="307" fill="#4b6970" font-size="18" font-weight="400" text-anchor="start">五项独立实验与逐针手册</text><text x="28" y="516" fill="#13796c" font-size="21" font-weight="600" text-anchor="start">继续迭代：阅读、标注、漫画、合并动态与公开案例。</text><text x="28" y="588" fill="#4b6970" font-size="12" font-weight="400" text-anchor="start">地瓜丸 · 作品与方法 / 内容关系示意</text></g></svg>